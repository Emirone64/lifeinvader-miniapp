<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111116">
  <title>Lifeinvader — запуск</title>
  <script src="https://telegram.org/js/telegram-web-app.js?70"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #111116; color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    main {
      width: min(100%, 430px); padding: 28px 22px; text-align: center;
      border: 1px solid #30303b; border-radius: 18px; background: #19191f;
    }
    .logo {
      width: 54px; height: 54px; margin: 0 auto 18px; display: grid;
      place-items: center; border-radius: 16px; background: #e32659;
      font-size: 30px; font-weight: 900;
    }
    h1 { margin: 0 0 10px; font-size: 19px; letter-spacing: 1px; }
    p { margin: 0; color: #aaaab6; font-size: 14px; line-height: 1.55; }
    #status { margin-top: 18px; color: #e8b65d; font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="logo">L</div>
    <h1>LIFEINVADER</h1>
    <p>Подключаем защищённую панель управления…</p>
    <div id="status">Получение данных Telegram</div>
  </main>

  <script>
    (() => {
      "use strict";

      const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzeKDHchL-YcAlEY1_elHcrypRtvP4EPRAfuyEG_0ZeBJPbM3vl3WXGTkRhyNrJvgIS/exec";
      const statusEl = document.getElementById("status");
      let attempts = 0;

      function hasTelegramLaunchParam(searchOrHash, paramName) {
        const raw = searchOrHash.startsWith("#")
          ? searchOrHash.slice(1)
          : searchOrHash.startsWith("?")
            ? searchOrHash.slice(1)
            : searchOrHash;
        try {
          return new URLSearchParams(raw).has(paramName);
        } catch (_) {
          return false;
        }
      }

      function hasLaunchParam(paramName) {
        return hasTelegramLaunchParam(window.location.search, paramName) ||
          hasTelegramLaunchParam(window.location.hash, paramName);
      }

      function showSafeDiagnostics(webApp, initData) {
        const sdkFound = !!webApp;
        const version = sdkFound && webApp.version ? String(webApp.version) : "нет";
        const platform = sdkFound && webApp.platform ? String(webApp.platform) : "нет";
        const unsafeUserPresent = !!(webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user);

        statusEl.textContent =
          "Диагностика запуска (без секретных данных): " +
          "SDK: " + (sdkFound ? "найден" : "не найден") +
          "; версия SDK Telegram: " + (hasLaunchParam("tgWebAppVersion") ? "параметр есть" : "параметра нет") +
          "; платформа в URL: " + (hasLaunchParam("tgWebAppPlatform") ? "параметр есть" : "параметра нет") +
          "; данные запуска в URL: " + (hasLaunchParam("tgWebAppData") ? "параметр есть" : "параметра нет") +
          "; версия WebApp: " + version +
          "; платформа WebApp: " + platform +
          "; длина initData: " + initData.length +
          "; initDataUnsafe.user: " + (unsafeUserPresent ? "есть" : "нет") +
          ". Пришли только этот диагностический текст.";
      }

      function launch() {
        attempts += 1;
        const webApp = window.Telegram && window.Telegram.WebApp;

        if (webApp) {
          try {
            webApp.ready();
            webApp.expand();
          } catch (_) {}
        }

        const initData = webApp && typeof webApp.initData === "string"
          ? webApp.initData
          : "";

        if (initData.trim()) {
          statusEl.textContent = "Открываем Lifeinvader…";
          const target = new URL(GAS_WEB_APP_URL);
          target.searchParams.set("tgWebAppData", initData);
          window.location.replace(target.toString());
          return;
        }

        if (attempts < 15) {
          window.setTimeout(launch, 200);
          return;
        }

        showSafeDiagnostics(webApp, initData);
      }

      launch();
    })();
  </script>
</body>
</html>
